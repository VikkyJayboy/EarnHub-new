<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnHub — Tasks & Rewards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .admin {
      color: white;
      text-decoration: none;
      border: 1px solid #ffffff55;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    .hero {
      padding: 70px 7%;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #2563eb;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #667085;
      font-size: 18px;
    }

    .buttons {
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e8eefc;
      color: #2563eb;
    }

    section {
      padding: 50px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 20px #0000000d;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #667085;
    }

    .task {
      border: 1px solid #e5e7eb;
    }

    .reward {
      color: #16a34a;
      font-weight: bold;
      margin-top: 12px;
    }

    footer {
      background: #111827;
      color: #aeb7c7;
      text-align: center;
      padding: 25px;
      margin-top: 20px;
    }

    @media (max-width: 750px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 32px;
      }

      header {
        padding: 16px 5%;
      }

      section,
      .hero {
        padding-left: 5%;
        padding-right: 5%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">EarnHub</div>
    <a class="admin" href="/admin.html">Owner / Admin</a>
  </header>

  <section class="hero">
    <h1>Complete Tasks. <span>Earn Rewards.</span></h1>
    <p>
      EarnHub is a rewards platform where users can discover tasks,
      earn rewards, and grow through referrals.
    </p>

    <div class="buttons">
      <a class="btn
